AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - test/dummy/db/schema.rb
    - vendor/**/*
Layout/LineLength:
  Max: 100
Metrics/BlockLength:
  Exclude:
    # Test blocks are long.
    - test/**/*_test.rb
    - activerecord-text-seach-configuration.gemspec
Metrics/ClassLength:
  Max: 150
  Exclude:
    # Test classes are long.
    - test/**/*_test.rb
Metrics/MethodLength:
  Max: 14
  Exclude:
    # Test methods are long.
    - test/**/*_test.rb
Naming/FileName:
  Exclude:
    - lib/activerecord-text-search-configuration.rb
Style/AsciiComments:
  Enabled: false
